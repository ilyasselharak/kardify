# Local development stack: PostgreSQL, Redis, API, web app.
#   cp backend/.env.example backend/.env  (fill in optional integrations)
#   docker compose up --build
# Web: http://localhost:3000   API: http://localhost:4000/api   Swagger: http://localhost:4000/api/docs

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kardify
      POSTGRES_PASSWORD: kardify
      POSTGRES_DB: kardify
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kardify -d kardify"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-off: applies Prisma migrations before the API starts.
  migrate:
    build: { context: ./backend, target: build }
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://kardify:kardify@postgres:5432/kardify
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  backend:
    build: { context: ./backend }
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://kardify:kardify@postgres:5432/kardify
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: http://localhost:3000
      API_PUBLIC_URL: http://localhost:4000
      CORS_ORIGINS: http://localhost:3000
      SWAGGER_ENABLED: "true"
    ports: ["4000:4000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_APP_URL: http://localhost:3000
        BACKEND_INTERNAL_URL: http://backend:4000
    environment:
      BACKEND_INTERNAL_URL: http://backend:4000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    ports: ["3000:3000"]
    depends_on: [backend]

volumes:
  postgres-data:
  redis-data:
